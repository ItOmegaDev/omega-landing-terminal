name: landing

services:
  app:
    build: .
    image: landing:latest
    container_name: landing
    restart: unless-stopped
    environment:
      PORT: "3000"
      MONGO_URL: mongodb://db:27017/landing
      TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - internal
    # Hardening: no writes outside /tmp, no capabilities, non-root user (see Dockerfile).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mongo:7.0
    container_name: landing-db
    restart: unless-stopped
    command: ["--bind_ip_all", "--quiet"]
    networks:
      - internal
    volumes:
      - db_data:/data/db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Shared with Caddy — the only network that reaches the public internet.
  web:
    external: true
  # Database stays unreachable from outside; no published ports.
  internal:
    internal: true

volumes:
  db_data:
